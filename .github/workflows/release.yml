name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

# Releases never overlap, and are never cancelled half-published.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.3

jobs:
  ci:
    name: CI
    # The self-repository form ($/...) would pin this to the running commit
    # too, but actionlint does not support it yet. For a job-level call, ./
    # already resolves to the caller's commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  release:
    name: Publish
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the release secrets; add protection rules (e.g. required
    # reviewers) in Settings → Environments to gate publishing.
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its files
      id-token: write # OIDC identity for keyless signing and attestations
      attestations: write # store build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog is built from history
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # A release must not trust caches that other workflows wrote.
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Build, sign, and publish
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: macOS signing and notarization are skipped without these.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # SLSA build provenance for every published file, verifiable with
      # `gh attestation verify <file> --repo biga-sh/cli`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
