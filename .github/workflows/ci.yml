name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml, so a release passes exactly the same gate.
  workflow_call:

# Every job starts from read-only access and asks for more only if it needs it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main and tags finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GORELEASER_VERSION: v2.18.3
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.31.0

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # x64 and arm64 on every operating system the CLI ships for.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
        go: [stable]
        include:
          # The oldest Go release go.mod supports.
          - os: ubuntu-latest
            go: oldstable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          flags=(-count=1 -timeout=10m)
          # The race detector does not support windows/arm64.
          if [[ "$RUNNER_OS" != Windows || "$RUNNER_ARCH" != ARM64 ]]; then flags+=(-race); fi
          go test "${flags[@]}" ./...

  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Linted per target OS, so platform-specific files are checked too.
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
        env:
          GOOS: ${{ matrix.goos }}

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Known vulnerabilities
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Workflow security
        run: pipx run "zizmor==${ZIZMOR_VERSION}" .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install script
        run: shellcheck --shell=sh install.sh

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # These builds are downloadable, so they must not come from a cache
          # another workflow could have written.
          cache: false

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      # Builds every archive and package exactly as a release would, without
      # signing or publishing anything.
      - name: Build all targets
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign

      - name: Upload builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: biga-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/checksums.txt
            dist/metadata.json
          retention-days: 7
          if-no-files-found: error

  install:
    name: Install (${{ matrix.os }})
    needs: release-dry-run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    env:
      # The dry run's files, served locally as a stand-in GitHub release.
      BIGA_RELEASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: biga-snapshot
          path: release

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory release >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in {1..40}; do curl -fs -o /dev/null "$BIGA_RELEASE_URL/checksums.txt" && break; sleep 0.25; done

          version=$(python -c 'import json; print(json.load(open("release/metadata.json"))["version"])')
          BIGA_VERSION="$version" BIGA_INSTALL_DIR="$RUNNER_TEMP/bin" sh ./install.sh
          "$RUNNER_TEMP/bin/biga" --version | grep -F "$version"

      - name: install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/test-install.ps1

      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./.github/scripts/test-install.ps1
