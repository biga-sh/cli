version: 2

updates:
  # Keeps the pinned action SHAs and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      charm:
        patterns: ["charm.land/*", "github.com/charmbracelet/*"]
      golang-x:
        patterns: ["golang.org/x/*"]
    commit-message:
      prefix: deps
